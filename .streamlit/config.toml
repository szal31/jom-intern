# Neutral light and dark themes, Apple-style system type. Visitors switch in the app menu; the default follows the device setting.
# Glass controls and the sliding nav pill live in assets/jom.css.

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"

[theme]
font = "-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
headingFontWeights = [650, 650, 600, 600, 600, 600]
codeFont = "ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
baseFontSize = 16
baseRadius = "12px"
buttonRadius = "full"
showWidgetBorder = true

[theme.light]
primaryColor = "#1D1D1F"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F5F7"
textColor = "#1D1D1F"
linkColor = "#0066CC"
borderColor = "#8E8E93"
blueColor = "#0066CC"
greenColor = "#1E7F3C"
orangeColor = "#B25000"
redColor = "#D70015"
dataframeHeaderBackgroundColor = "#F5F5F7"

[theme.light.sidebar]
backgroundColor = "#F5F5F7"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#F5F5F7"
backgroundColor = "#111113"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F5F5F7"
linkColor = "#2997FF"
borderColor = "#7C7C80"
blueColor = "#2997FF"
greenColor = "#30D158"
orangeColor = "#FF9F0A"
redColor = "#FF453A"
dataframeHeaderBackgroundColor = "#1C1C1E"

[theme.dark.sidebar]
backgroundColor = "#1C1C1E"
secondaryBackgroundColor = "#2C2C2E"
